apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-stg
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: 13.6.0
      helm:
        releaseName: grafana
        valueFiles:
          - $values/grafana/values.yaml

    - repoURL: https://github.com/laxmanraouppada/monitoring-stg.git
      targetRevision: master
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring-stg

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
    syncOptions:
      - CreateNamespace=true
