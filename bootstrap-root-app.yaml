
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-bootstrap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/laxmanraouppada/argocd-demo.git
    targetRevision: main
    path: monitoring/bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
